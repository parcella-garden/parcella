{% extends "base.html" %}
{% block title %}{{ t('auth.login.title') }}{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: #f4f7f4;">
    <div style="width: 100%; max-width: 400px; padding: 1rem;">
        <div class="text-center mb-4">
            <div style="font-size: 3rem; color: var(--gv-gruen);">
                <img src="{{ request.state.logo_url or '/static/favicon.png' }}" alt="{{ request.state.club_name }}"
                     style="height: 48px; width: auto; max-width: 100%;">
            </div>
            <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--gv-gruen);">{{ request.state.club_name }}</h1>
            <p class="text-muted" style="font-size: 0.85rem;">{{ t('auth.login.subtitle') }}</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            {{ error }}
        </div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post" action="/auth/login">
                    {{ csrf_field() }}
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="email">{{ t('auth.login.label_email') }}</label>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="{{ t('auth.login.email_placeholder') }}" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="password">{{ t('auth.login.label_password') }}</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i> {{ t('auth.login.button_submit') }}
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted mt-3" style="font-size: 0.8rem;">
            {{ t('auth.login.no_account_notice') }}
        </p>
    </div>
</div>
{% endblock %}
