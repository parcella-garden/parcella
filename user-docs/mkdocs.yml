site_name: Parcella Documentation
site_url: https://docs.parcella.org/
site_description: User guide for Parcella, the open-source management software for allotment garden associations.
repo_url: https://github.com/parcella-garden/parcella
repo_name: parcella-garden/parcella
edit_uri: edit/main/user-docs/docs/
copyright: Parcella is free software under the AGPL-3.0. Documentation licensed CC BY-SA 4.0.

theme:
  name: material
  language: en
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: parcella
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

extra_css:
  - assets/stylesheets/parcella.css

extra:
  homepage: https://parcella.org
  social:
    - icon: material/forum
      link: https://forum.parcella.org
      name: Community forum
    - icon: fontawesome/brands/github
      link: https://github.com/parcella-garden/parcella
      name: Source code

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys

plugins:
  - search
  # Translations (issue #365, see STYLE.md "Translations"): suffix
  # structure, so members.md is English and members.de.md its German
  # version, side by side; screenshots the same way (list.de.png).
  # A page or screenshot without a translation falls back to English.
  # A language is only built (build: true) once it has its first
  # translated pages, so the live site never offers a language that is
  # English behind the switcher. Nav titles per language go under
  # nav_translations when that happens.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_name: Parcella-Handbuch
          site_description: Handbuch für Parcella, die Open-Source-Software für Kleingartenvereine.
          nav_translations:
            Home: Startseite
            Getting started: Erste Schritte
            First login and your account: Erste Anmeldung und dein Konto
            Finding your way around: Sich zurechtfinden
            Roles, groups and permissions: Rollen, Gruppen und Rechte
            Dashboard: Dashboard
            Modules: Module
            Members: Mitglieder
            Parcels: Parzellen
            Applicants: Bewerber
            Work hours: Arbeitsstunden
            Water and electricity: Wasser und Strom
            Insurance: Versicherungen
            Finances: Finanzen
            Invoice runs: Rechnungsläufe
            Invoices, payments and reminders: Rechnungen, Zahlungen und Mahnungen
            Bank accounts and bookings: Konten und Buchungen
            Incoming invoices: Eingangsrechnungen
            Categories, budget and statement: Kategorien, Haushaltsplan und Übersicht
            Purchase requests: Einkaufswünsche
            Calendar: Kalender
            Announcements: Mitteilungen
            Task board: Aufgabenboard
