            Modules: Modules
            Members: Membres
            Parcels: Parcelles
            Applicants: Candidats
            Work hours: Heures de travail
            Water and electricity: Eau et électricité
            Insurance: Assurances
            Finances: Finances
            Invoice runs: Séries de factures
            Invoices, payments and reminders: Factures, paiements et relances
