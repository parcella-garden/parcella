            Setting up a new club: Einen neuen Verein einrichten
            Importing members and parcels: Mitglieder und Parzellen importieren
            Welcoming a new member: Ein neues Mitglied aufnehmen
            Handing over a parcel: Eine Parzelle übergeben
            Running the annual invoices: Die Jahresrechnung erstellen
            Collecting meter readings: Zählerstände erfassen
            Organising a work session: Einen Arbeitseinsatz organisieren
            Administration: Administration
            Club settings: Vereinseinstellungen
            Turning modules on and off: Module ein- und ausschalten
            Users and invitations: Benutzer und Einladungen
            Groups: Gruppen
            Integrations: Integrationen
            Backup and restore: Backup und Wiederherstellung
            E-mail log: E-Mail-Protokoll
            Sample data: Beispieldaten
            System information and updates: Systeminfo und Updates
            API tokens: API-Tokens
            For gardeners: Für Gärtner
            Glossary: Glossar
        - locale: pl
          name: Polski
          build: false
        - locale: cs
          name: Čeština
          build: false
        - locale: sk
          name: Slovenčina
          build: false
        - locale: fr
          name: Français
          build: true
          site_name: Manuel Parcella
          site_description: Manuel de Parcella, le logiciel open source pour les associations de jardins familiaux.
          nav_translations:
            Home: Accueil
