- name: work-hours/overview
  url: /work-hours/
# The sessions table is newest first, so this opens the sample data's
# upcoming "Fence repair" session (participant, tasks, New badge).
- name: work-hours/session-detail
  from: /work-hours/
  follow: '^/work-hours/sessions/[0-9a-f-]{36}$'
  full_page: true
- name: work-hours/session-form
  url: /work-hours/sessions/new
- name: work-hours/evaluation
  url: /work-hours/evaluation
- name: work-hours/sponsorships
  url: /work-hours/sponsorships
  full_page: true
- name: work-hours/transfers
  url: /work-hours/transfers
- name: work-hours/tasks
  url: /work-hours/tasks
  full_page: true
- name: work-hours/club-roles
  url: /work-hours/club-roles
  full_page: true
- name: work-hours/configuration
  url: /work-hours/configuration
- name: work-hours/configuration-form
  from: /work-hours/configuration
  follow: '^/work-hours/configuration/[0-9a-f-]{36}/edit$'
# Not photographed: sponsorship edit, club role edit and club-role
# assignment edit -- the sample data contains no sponsorships, club roles
# or assignments, so there is no link to follow.
