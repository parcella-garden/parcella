PLG_SYSTEM_PARCELLACONNECTOR="System - Parcella Connector"
PLG_SYSTEM_PARCELLACONNECTOR_XML_DESCRIPTION="Empfängt Webseiten-Entwürfe aus Parcella, der Vereinsverwaltung für Kleingartenvereine, als unveröffentlichte Beiträge."
PLG_SYSTEM_PARCELLACONNECTOR_HOWTO_LABEL="Parcella verbinden"
PLG_SYSTEM_PARCELLACONNECTOR_HOWTO_DESC="Öffnen Sie in Parcella Admin → Integrationen → Webseite, wählen Sie „Parcella-Plugin“ und tragen Sie die Plugin-Adresse <code>https://IHRE-SEITE/index.php/parcella/v1</code> sowie den gemeinsamen Schlüssel unten ein. Entwürfe kommen als unveröffentlichte Beiträge an; veröffentlichen bleibt Ihre Entscheidung. Denken Sie daran, dieses Plugin zu aktivieren."
PLG_SYSTEM_PARCELLACONNECTOR_SECRET_LABEL="Gemeinsamer Schlüssel"
PLG_SYSTEM_PARCELLACONNECTOR_SECRET_DESC="Wird bei der Installation erzeugt. Parcella signiert damit jede Anfrage; behandeln Sie ihn wie ein Passwort. Zum Ändern 64 neue Hexadezimalzeichen eintragen (z. B. aus <code>openssl rand -hex 32</code>) und denselben Wert in Parcella eintragen."
PLG_SYSTEM_PARCELLACONNECTOR_CATEGORY_LABEL="Kategorie für Entwürfe"
PLG_SYSTEM_PARCELLACONNECTOR_CATEGORY_DESC="Neue Entwürfe werden als unveröffentlichte Beiträge in dieser Kategorie angelegt."
PLG_SYSTEM_PARCELLACONNECTOR_AUTHOR_LABEL="Autor neuer Entwürfe"
PLG_SYSTEM_PARCELLACONNECTOR_AUTHOR_DESC="Der Benutzer, als der neue Beiträge angelegt werden."
