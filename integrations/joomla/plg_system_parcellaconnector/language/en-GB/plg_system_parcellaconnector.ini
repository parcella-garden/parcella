PLG_SYSTEM_PARCELLACONNECTOR="System - Parcella Connector"
PLG_SYSTEM_PARCELLACONNECTOR_XML_DESCRIPTION="Receives website drafts from Parcella, the club management software for allotment garden associations, as unpublished articles."
PLG_SYSTEM_PARCELLACONNECTOR_HOWTO_LABEL="Connecting Parcella"
PLG_SYSTEM_PARCELLACONNECTOR_HOWTO_DESC="In Parcella, open Admin → Integrations → Website, choose “Parcella plugin” and enter the plugin address <code>https://YOUR-SITE/index.php/parcella/v1</code> and the shared secret below. Drafts arrive as unpublished articles; publishing stays your decision. Remember to enable this plugin."
PLG_SYSTEM_PARCELLACONNECTOR_SECRET_LABEL="Shared secret"
PLG_SYSTEM_PARCELLACONNECTOR_SECRET_DESC="Generated at install. Parcella signs every request with it; treat it like a password. To change it, enter 64 new hexadecimal characters (e.g. from <code>openssl rand -hex 32</code>) and enter the same value in Parcella."
PLG_SYSTEM_PARCELLACONNECTOR_CATEGORY_LABEL="Category for drafts"
PLG_SYSTEM_PARCELLACONNECTOR_CATEGORY_DESC="New drafts are created as unpublished articles in this category."
PLG_SYSTEM_PARCELLACONNECTOR_AUTHOR_LABEL="Author of new drafts"
PLG_SYSTEM_PARCELLACONNECTOR_AUTHOR_DESC="The user new articles are created by."
