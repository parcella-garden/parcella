name: CI

# Runs the full test suite on every pull request and every push to main
# (ADR 0119). release.yml calls this same workflow before it publishes an
# image, so a release and a PR are tested the exact same way.
# A PR or push that only touches docs (docs/, user-docs/, *.md) skips the
# suite: the job still runs and goes green, because branch protection
# requires the `test` check (a workflow skipped by `paths-ignore` would
# leave it pending forever). Releases always run the full suite.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to the same PR cancels the run it supersedes. Release runs
  # (workflow_call from a tag) get their own group and are never cancelled.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docs-only change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Anything unclear (API error, new branch, release) runs the full suite.
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename') || files=""
            # The compare API lists at most 300 files: a longer list may hide code.
            if [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then files=""; fi
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|user-docs/)|\.md$'; then
            echo "Only docs changed, skipping the test suite:"; printf '  %s\n' $files
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set UID/GID for the web container
        if: steps.changes.outputs.code == 'true'
        run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env

      - name: Guard against a committed backup dump
        run: |
          if git ls-files | grep -qE '(^|/)backups/.*\.(sql|dump)$'; then
            echo "::error::A backup file is tracked under backups/ -- this must never be committed."
            exit 1
          fi

      - name: Run test suite
        if: steps.changes.outputs.code == 'true'
        run: ./run_tests.sh
