name: parcella

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcella}
      POSTGRES_USER: ${POSTGRES_USER:-parcella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcella}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/parcella-garden/parcella:${PARCELLA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parcella}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-parcella}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@parcella.local}
      SMTP_TLS: ${SMTP_TLS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/app/static/uploads
      - ./data/ticket_attachments:/app/app/private_uploads/ticket_attachments
